<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Family Chores</title>
  <meta name="description" content="Daily, weekly and monthly family chores with a shared check-off list and a daily score.">
  <meta name="theme-color" content="#2a6f6a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="favicon.svg" alt="">
      <h1 id="familyName">Family Chores</h1>
    </div>
    <span id="syncPill" class="sync-pill" title="Where your data lives">This device</span>
  </header>

  <nav class="tabs" aria-label="Sections">
    <a href="#today" data-tab="today"><span class="ico" aria-hidden="true">✅</span>Today</a>
    <a href="#history" data-tab="history"><span class="ico" aria-hidden="true">📈</span>History</a>
    <a href="#chores" data-tab="chores"><span class="ico" aria-hidden="true">🧹</span>Chores</a>
    <a href="#family" data-tab="family"><span class="ico" aria-hidden="true">👪</span>Family</a>
  </nav>

  <main id="app" aria-live="polite">
    <div class="card"><p class="muted">Loading…</p></div>
  </main>

  <dialog id="dialog"><form method="dialog" class="dlg" id="dialogForm"></form></dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="js/firebase-config.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
